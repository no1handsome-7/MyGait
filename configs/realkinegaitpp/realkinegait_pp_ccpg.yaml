# ===================================================================
# RealKineGait++ on CCPG
# ===================================================================
# Key upgrades from v0.1:
#   1. Phase-Canonical Kinematic Tokens (num_phase_bins: 16)
#   2. Causal Nuisance Intervention (CausalDecorrelationLoss)
#   3. Uncertainty-aware Privileged Distillation (UncertaintyAwareDistillationLoss)
#   4. Silhouette Integration (SilhouetteForegroundLoss + BackgroundAdversarialLoss)
#   5. Pose Kinematic Teacher (PoseAlignmentLoss)
# ===================================================================

data_cfg:
  dataset_name: CCPG
  dataset_root: ./data/RealKineGait/CCPG
  dataset_partition: ./datasets/CCPG/CCPG.json
  # 00-rgb  01-sil  02-pose  03-motion_text  04-nuisance_text  05-smpl
  data_in_use: [true, true, true, true, true, true]
  num_workers: 8
  remove_no_gallery: false
  test_dataset_name: CCPG

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_name: RealKineGaitPP_CCPG
  eval_func: evaluate_CCPG
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 240
  metric: euc
  transform:
    - type: BaseRgbTransform
    - type: BaseSilCuttingTransform
    - type: PoseSequenceTransform
    - type: BaseFeatureTransform
    - type: BaseFeatureTransform
    - type: BaseFeatureTransform

loss_cfg:
  # === Standard identity losses ===
  - type: TripletLoss
    log_prefix: triplet
    loss_term_weight: 1.0
    margin: 0.2

  - type: CrossEntropyLoss
    log_prefix: softmax
    loss_term_weight: 1.0
    scale: 16
    log_accuracy: true

  # === [Innovation 2] Causal Nuisance Intervention ===
  - type: CausalDecorrelationLoss
    log_prefix: cd
    loss_term_weight: 0.05
    conditional_weight: 0.5
    hard_negative_weight: 0.3
    swap_consistency_weight: 0.3
    nuisance_sim_threshold: 0.8

  # === Motion alignment ===
  - type: MotionAlignmentLoss
    log_prefix: motion_align
    loss_term_weight: 0.05
    temperature: 0.07

  # === Counterfactual consistency (same-ID different-nuisance pull) ===
  - type: CounterfactualConsistencyLoss
    log_prefix: counterfactual
    loss_term_weight: 0.05
    temperature: 0.2

  # === [Innovation 1] Phase-Canonical Consistency ===
  - type: PhaseCanonicalConsistencyLoss
    log_prefix: phase
    loss_term_weight: 0.02
    smooth_weight: 0.5
    antiphase_weight: 0.5
    diversity_weight: 0.2
    foot_indices: [7, 8]

  # === [Innovation 3] Uncertainty-Aware Distillation ===
  - type: UncertaintyAwareDistillationLoss
    log_prefix: distill_unc
    loss_term_weight: 0.05
    cosine_weight: 0.5
    mse_weight: 0.5
    calibration_weight: 0.01

  # === [Innovation 4] Silhouette Foreground Penalty ===
  - type: SilhouetteForegroundLoss
    log_prefix: sil_fg
    loss_term_weight: 0.02

  # === [Innovation 4] Background Adversarial ===
  - type: BackgroundAdversarialLoss
    log_prefix: sil_bg_adv
    loss_term_weight: 0.01
    temperature: 0.2

  # === Pose alignment ===
  - type: PoseAlignmentLoss
    log_prefix: pose_align
    loss_term_weight: 0.03
    cosine_weight: 0.5
    mse_weight: 0.5

model_cfg:
  model: RealKineGaitPP
  lvm_name_or_path: ./pretrained_LVMs/dinov2-small
  freeze_lvm: true
  lvm_dim: 384
  lvm_layers: [3, 7, 11]
  image_hw: [224, 112]
  feature_hw: [32, 16]
  adapter_dim: 256
  parts_num: 10
  foot_indices: [7, 8]
  kinematic_depth: 2
  kinematic_heads: 4
  graph_bias_strength: 0.25
  part_temperature: 0.07

  # [Innovation 1] Phase-Canonical
  num_phase_bins: 16
  phase_temperature: 1.0

  # [Innovation 4] Silhouette
  use_sil: true

  # Pose teacher
  use_pose_teacher: true
  num_pose_joints: 17

  # Text / teacher dimensions
  text_dim: 512
  smpl_dim: 256

  input_indices:
    rgb: 0
    sil: 1
    pose: 2
    motion_text: 3
    nuisance_text: 4
    smpl: 5

  SeparateFCs:
    in_channels: 256
    out_channels: 256
  SeparateBNNecks:
    class_num: 100
    in_channels: 256
  bin_num: [16, 8, 4, 2, 1]

optimizer_cfg:
  solver: AdamW
  lr: 0.0002
  weight_decay: 0.05

scheduler_cfg:
  scheduler: CosineAnnealingLR
  T_max: 80000
  eta_min: 0.000001

trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_iter: 10000
  save_name: RealKineGaitPP_CCPG
  sync_BN: true
  total_iter: 80000
  sampler:
    type: TripletSampler
    batch_shuffle: true
    batch_size: [8, 4]
    frames_num_fixed: 30
    frames_skip_num: 4
    sample_type: fixed_ordered
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomHorizontalFlip
        - type: BaseRgbTransform
    - type: Compose
      trf_cfg:
        - type: RandomHorizontalFlip
        - type: SilhouetteContourPerturbation
          prob: 0.3
          max_dilate: 4
        - type: BaseSilCuttingTransform
    - type: PoseSequenceTransform
    - type: BaseFeatureTransform
    - type: BaseFeatureTransform
    - type: BaseFeatureTransform
