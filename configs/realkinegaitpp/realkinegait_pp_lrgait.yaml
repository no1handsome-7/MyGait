# ===================================================================
# RealKineGait++ on LRGait
# ===================================================================
# Event and point cloud teachers both active with uncertainty estimation.

data_cfg:
  dataset_name: LRGait
  dataset_root: ./data/RealKineGait/LRGait
  dataset_partition: ./datasets/LRGait/LRGait.json
  # 00-rgb 01-sil 02-pose 03-motion_text 04-nuisance_text 05-smpl 06-pointcloud
  # (07-event if available — add to data_in_use and input_indices)
  data_in_use: [true, true, true, true, true, true, true]
  num_workers: 8
  remove_no_gallery: false
  test_dataset_name: LRGait

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_name: RealKineGaitPP_LRGait
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 720
    points_in_use: {pointcloud_index: 6, points_num: 1024}
  metric: euc
  transform:
    - {type: BaseRgbTransform}
    - {type: BaseSilCuttingTransform}
    - {type: PoseSequenceTransform}
    - {type: BaseFeatureTransform}
    - {type: BaseFeatureTransform}
    - {type: BaseFeatureTransform}
    - {type: PointCloudsTransform, xyz_only: true, scale_aware: true}

loss_cfg:
  - {type: TripletLoss, log_prefix: triplet, loss_term_weight: 1.0, margin: 0.2}
  - {type: CrossEntropyLoss, log_prefix: softmax, loss_term_weight: 1.0, scale: 16, log_accuracy: true}
  - {type: CausalDecorrelationLoss, log_prefix: cd, loss_term_weight: 0.05, conditional_weight: 0.5, hard_negative_weight: 0.3, swap_consistency_weight: 0.3}
  - {type: MotionAlignmentLoss, log_prefix: motion_align, loss_term_weight: 0.05, temperature: 0.07}
  - {type: CounterfactualConsistencyLoss, log_prefix: counterfactual, loss_term_weight: 0.05, temperature: 0.2}
  - {type: PhaseCanonicalConsistencyLoss, log_prefix: phase, loss_term_weight: 0.02, smooth_weight: 0.5, antiphase_weight: 0.5, diversity_weight: 0.2, foot_indices: [7, 8]}
  - {type: UncertaintyAwareDistillationLoss, log_prefix: distill_unc, loss_term_weight: 0.08, cosine_weight: 0.5, mse_weight: 0.5, calibration_weight: 0.01}
  - {type: SilhouetteForegroundLoss, log_prefix: sil_fg, loss_term_weight: 0.02}
  - {type: BackgroundAdversarialLoss, log_prefix: sil_bg_adv, loss_term_weight: 0.01, temperature: 0.2}
  - {type: PoseAlignmentLoss, log_prefix: pose_align, loss_term_weight: 0.03}

model_cfg:
  model: RealKineGaitPP
  lvm_name_or_path: ./pretrained_LVMs/dinov2-small
  freeze_lvm: true
  lvm_dim: 384
  lvm_layers: [3, 7, 11]
  image_hw: [224, 112]
  feature_hw: [32, 16]
  adapter_dim: 256
  parts_num: 10
  foot_indices: [7, 8]
  kinematic_depth: 2
  kinematic_heads: 4
  graph_bias_strength: 0.25
  part_temperature: 0.07
  num_phase_bins: 16
  phase_temperature: 1.0
  use_sil: true
  use_pose_teacher: true
  num_pose_joints: 17
  text_dim: 512
  smpl_dim: 256
  pc_in_dim: 4
  input_indices: {rgb: 0, sil: 1, pose: 2, motion_text: 3, nuisance_text: 4, smpl: 5, pointcloud: 6}
  SeparateFCs: {in_channels: 256, out_channels: 256}
  SeparateBNNecks:
    class_num: 1000
    in_channels: 256
  bin_num: [16, 8, 4, 2, 1]

optimizer_cfg: {solver: AdamW, lr: 0.0002, weight_decay: 0.05}
scheduler_cfg: {scheduler: CosineAnnealingLR, T_max: 100000, eta_min: 0.000001}
trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: false
  restore_hint: 0
  save_iter: 10000
  save_name: RealKineGaitPP_LRGait
  sync_BN: true
  total_iter: 100000
  sampler:
    type: TripletSampler
    batch_shuffle: true
    batch_size: [8, 4]
    frames_num_fixed: 30
    frames_skip_num: 4
    sample_type: fixed_ordered
    points_in_use: {pointcloud_index: 6, points_num: 1024}
  transform:
    - {type: Compose, trf_cfg: [{type: RandomHorizontalFlip}, {type: BaseRgbTransform}]}
    - {type: Compose, trf_cfg: [{type: RandomHorizontalFlip}, {type: SilhouetteContourPerturbation, prob: 0.3}, {type: BaseSilCuttingTransform}]}
    - {type: PoseSequenceTransform}
    - {type: BaseFeatureTransform}
    - {type: BaseFeatureTransform}
    - {type: BaseFeatureTransform}
    - {type: PointCloudsTransform, xyz_only: true, scale_aware: true, scale_prob: 0.2, flip_prob: 0.15, jit_prob: 0.1}
