data_cfg:
  dataset_name: CCPG
  dataset_root: /data3/user25/code/OpenGait/data/CCPG_processed
  dataset_partition: ./datasets/CCPG/CCPG.json
  num_workers: 4
  data_in_use:
  - false
  - false
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - false
  - true
  - true
  remove_no_gallery: false
  test_dataset_name: CCPG
  cache: false
evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 40000
  save_name: GaitOracle_RGBSil_CCPG
  eval_func: evaluate_CCPG
  sampler:
    batch_shuffle: false
    batch_size: 2
    sample_type: all_ordered
    frames_all_limit: 720
    frames_num_fixed: 30
    frames_skip_num: 0
  metric: euc
  transform:
  - type: BaseRgbNormalizeTransform
  - type: BaseSilCuttingTransform
  - type: TextFeatureTransform     # ipts[2] qwen25vl_background_feat.pkl
  - type: NuisanceMaskTransform    # ipts[3] qwen25vl_background_mask.pkl
  - type: TextFeatureTransform     # ipts[4] qwen25vl_carrying_feat.pkl
  - type: NuisanceMaskTransform    # ipts[5] qwen25vl_carrying_mask.pkl
  - type: TextFeatureTransform     # ipts[6] qwen25vl_clothing_feat.pkl
  - type: NuisanceMaskTransform    # ipts[7] qwen25vl_clothing_mask.pkl
  - type: TextFeatureTransform     # ipts[8] qwen25vl_occlusion_feat.pkl
  - type: NuisanceMaskTransform    # ipts[9] qwen25vl_occlusion_mask.pkl
loss_cfg:
- loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet
- loss_term_weight: 1.0
  scale: 16
  type: CrossEntropyLoss
  log_prefix: softmax
  log_accuracy: true
- loss_term_weight: 1.0
  type: ScalarLoss
  log_prefix: gaitoracle_aux
model_cfg:
  model: GaitOracle
  channels: 512
  parts_num: 16
  rgb_index: 0
  sil_index: 1
  pc_index: null
  text_dim: 3584
  rgb_backbone:
    type: tiny
    # type: timm
    # model_name: vit_small_patch14_dinov2.lvd142m
    # pretrained: false
    # checkpoint_path: /data3/user25/code/OpenGait/checkpoints/dinov2-small.safetensors
    # freeze: true
    # img_size:
    # - 224
    # - 112
    # chunk_size: 16

  positive_text:
    text_dim: 3584
    prompt_feat_path: tools/gaitoracle/gait_positive_prompt_feat.npy
    num_prompts: 4
    trainable: false
  cycle_temporal:
    heads: 4
    layers: 1
    dropout: 0.1
    future_pred: true
  # nuisance_indices:
  #   clothing: 2
  #   carrying: 3
  #   background: 4
  #   occlusion: 5
  # nuisance_mask_indices:
  #   clothing: 6
  #   carrying: 7
  #   background: 8
  #   occlusion: 9
  nuisance_indices:
    background: 2
    carrying: 4
    clothing: 6
    occlusion: 8
  nuisance_mask_indices:
    background: 3
    carrying: 5
    clothing: 7
    occlusion: 9
  nuisance_detach:
    enabled: true
    text_dim: 3584
    sub_dim: 256
    grl_lambda: 0.05
    temperature: 0.07
    loss_weight: 0.05
    factors:
    - clothing
    - carrying
    - background
    - occlusion
  rgb_anchor_weight: 0.2
  future_weight: 0.02
  verifier:
    attention_weight: 0.01
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 100
    in_channels: 256
    parts_num: 16
optimizer_cfg:
  lr: 0.05
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005
scheduler_cfg:
  gamma: 0.1
  milestones:
  - 15000
  - 25000
  - 35000
  # - 45000
  scheduler: MultiStepLR
trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  with_test: true
  log_iter: 100
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 0
  save_iter: 5000
  save_name: GaitOracle_RGBSil_CCPG
  sync_BN: true #true for dinov2
  total_iter: 40000
  sampler:
    batch_shuffle: true
    batch_size:
    - 8
    - 4
    frames_num_fixed: 30
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
  - type: BaseRgbNormalizeTransform
  - type: BaseSilCuttingTransform
  - type: TextFeatureTransform     # ipts[2] qwen25vl_background_feat.pkl
  - type: NuisanceMaskTransform    # ipts[3] qwen25vl_background_mask.pkl
  - type: TextFeatureTransform     # ipts[4] qwen25vl_carrying_feat.pkl
  - type: NuisanceMaskTransform    # ipts[5] qwen25vl_carrying_mask.pkl
  - type: TextFeatureTransform     # ipts[6] qwen25vl_clothing_feat.pkl
  - type: NuisanceMaskTransform    # ipts[7] qwen25vl_clothing_mask.pkl
  - type: TextFeatureTransform     # ipts[8] qwen25vl_occlusion_feat.pkl
  - type: NuisanceMaskTransform    # ipts[9] qwen25vl_occlusion_mask.pkl


