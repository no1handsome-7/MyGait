data_cfg:
  dataset_name: SUSTech1K
  dataset_root: /data3/user25/dataset-make/gait/OpenGait/data/sustech1k/SUSTech1K-Released-pkl
  dataset_partition: ./datasets/SUSTech1K/SUSTech1K.json
  num_workers: 4
  data_in_use: [false,false,false,false,false,false,false,false,true,false,false,false,false,true,false,false,true,true,true,true,true,true,false,true,true]
  remove_no_gallery: false
  test_dataset_name: SUSTech1K
  cache: false

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 50000
  save_name: GaitMoEOracleV2Max_SUSTech1K_Vis
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    points_in_use: {pointcloud_index: 0, points_num: 1024}
    batch_size: 1
    frames_num_fixed: 10
    frames_skip_num: 0
    sample_type: all_ordered
    frames_all_limit: 720
  metric: euc
  transform:
  - {type: PointCloudsTransform, xyz_only: true, scale_aware: true, points_num: 1024}
  - {type: BaseRgbNormalizeTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}

loss_cfg:
# ---- Main losses ----
- {loss_term_weight: 1.0, margin: 0.2, type: TripletLoss, log_prefix: triplet}
- {loss_term_weight: 1.0, scale: 16, type: CrossEntropyLoss, log_prefix: softmax, log_accuracy: true}
- {loss_term_weight: 1.0, type: ScalarLoss, log_prefix: gaitoracle_aux}
# ---- Branch auxiliary losses (NEW, weight controlled by model internally via ramp) ----
- {loss_term_weight: 0.3, margin: 0.2, type: TripletLoss, log_prefix: rgb_aux_triplet}
- {loss_term_weight: 0.3, scale: 16, type: CrossEntropyLoss, log_prefix: rgb_aux_softmax}
- {loss_term_weight: 0.3, margin: 0.2, type: TripletLoss, log_prefix: pc_aux_triplet}
- {loss_term_weight: 0.3, scale: 16, type: CrossEntropyLoss, log_prefix: pc_aux_softmax}

model_cfg:
  model: GaitMoEOracleV2MaxVis
  channels: 512
  parts_num: 16
  rgb_index: 1
  pc_index: 0
  text_dim: 3584
  pc_in_dim: 3
  pc_encoder_type: lidargaitpp
  proj_dim: 512
  use_scalar_aux_loss: true
  collect_visualization: true
  viz_output_dir: ./viz_output_v2max_sustech1k_vis
  rgb_backbone: {type: tiny}
  text_adapter: {input_dim: 3584, code_dim: 256, hidden_dim: 1024, dropout: 0.1}
  positive_text: {text_dim: 3584, text_code_dim: 256, text_hidden_dim: 1024, prompt_feat_path: tools/gaitoracle/gait_positive_prompt_feat.npy, num_prompts: 4, trainable: false, dropout: 0.1}
  cycle_temporal: {heads: 4, layers: 1, dropout: 0.1, future_pred: true}
  modality_quality: {hidden_dim: 128}  # legacy (used when qact_enabled: false)

  # ---- Quality-Aware Context Tokens (QACT) ----
  quality_context:
    num_tokens: 8            # K context probes per modality
    num_heads: 4             # attention heads in probe
    dropout: 0.1
    consistency_weight: 0.02 # cross-modal context consistency loss
    diversity_weight: 0.03   # token diversity regularization
    cross_probe_enabled: true
    joint_refine_enabled: true

  # ---- Cross-Modal Alignment ----
  cross_modal_align:
    align_dim: 128
    num_heads: 4
    temperature: 0.07
    align_weight: 0.15
    plc_weight: 1.0
    ims_weight: 0.3
    warmup_iters: 2000
    ramp_iters: 8000
    hard_ratio: 0.5        # hard negative mining ratio (NEW)

  # ---- Pre-Fusion Temporal (NEW) ----
  pre_fusion_temporal:
    kernel_size: 3

  # ---- Nuisance ----
  nuisance_indices: {background: 2, carrying: 4, clothing: 6, occlusion: 8}
  nuisance_mask_indices: {background: 3, carrying: 5, clothing: 7, occlusion: 9}
  nuisance_detach:
    enabled: true
    text_dim: 3584
    text_code_dim: 256
    text_hidden_dim: 1024
    sub_dim: 256
    grl_lambda: 0.08
    temperature: 0.07
    warmup_iters: 5000
    probe_iters: 10000
    adv_ramp_iters: 10000
    reliability_start_iter: 15000
    reliability_ramp_iters: 10000
    probe_loss_weight: 0.03
    adv_loss_weight: 0.03
    mask_loss_weight: 0.015
    max_suppression: 0.35
    detach_reliability_gate: true
    dropout: 0.1
    factors: [clothing, carrying, background, occlusion]
    factor_weights: {clothing: 1.0, carrying: 1.0, background: 0.6, occlusion: 1.0}

  # ---- Heterogeneous Expert Configs (Method A + C) ----
  # Uncomment to override defaults. If not specified, uses default_*_configs().
  expert_configs:
    appearance:
    - {type: pointwise, rank: 8}
    - {type: pointwise, rank: 8}
    - {type: local_conv, rank: 16, kernel_size: 3}
    - {type: local_conv, rank: 16, kernel_size: 3}
    - {type: local_conv, rank: 16, kernel_size: 5}
    - {type: local_conv, rank: 16, kernel_size: 5}
    - {type: global_attn, rank: 32}
    - {type: global_attn, rank: 32}
    structure:
    - {type: pointwise, rank: 8}
    - {type: pointwise, rank: 8}
    - {type: local_conv, rank: 16, kernel_size: 3}
    - {type: local_conv, rank: 16, kernel_size: 3}
    - {type: local_conv, rank: 16, kernel_size: 5}
    - {type: local_conv, rank: 16, kernel_size: 5}
    - {type: global_attn, rank: 32}
    - {type: global_attn, rank: 32}

  # Fusion expert ranks (capacity heterogeneity)
  fusion_expert_ranks: [16, 16, 32, 32, 32, 64, 64, 64]

  # ================================================================
  #  ABLATION SWITCHES — set to false to disable for ablation study
  # ================================================================
  ablation:
    # ---- Original V2Pro switches ----
    appearance_moe_enabled: true
    appearance_num_experts: 8
    appearance_topk: 2
    structure_moe_enabled: true
    structure_num_experts: 8
    structure_topk: 2
    fusion_moe_enabled: true
    fusion_fallback: cross_attention
    fusion_num_experts: 8
    fusion_topk: 2
    fusion_condition_aware: true
    fusion_expert_rank: 32             # default rank for shared fusion expert
    temporal_type: cycle_aware
    text_guidance_enabled: true
    nuisance_detach_enabled: true
    expert_rank: 16                    # fallback rank for homogeneous mode
    expert_dropout: 0.0
    cond_dim: 64
    cond_hidden_dim: 128
    num_illum_bins: 5
    num_dist_bins: 5
    balance_loss_weight: 0.02
    diversity_loss_weight: 0.01
    diversity_threshold: 0.5
    condition_cls_weight: 0.1
    z_loss_weight: 0.01
    quality_loss_weight: 0.05
    modality_dropout: 0.1

    # ---- V2Max NEW switches (all individually toggleable) ----
    # (1) Shared Expert Isolation
    shared_expert_enabled: true
    shared_expert_rank: 16

    # (2) Heterogeneous Expert Design (Method A+C)
    heterogeneous_experts_enabled: true

    # (3) Branch-Level Auxiliary Supervision
    branch_aux_enabled: true
    branch_aux_weight: 0.3             # loss weight (ramped)
    branch_aux_warmup_iters: 2000      # warmup from 0 to branch_aux_weight
    branch_aux_out_channels: 256

    # (4) Pre-Fusion Temporal Aggregation
    pre_fusion_temporal_enabled: true

    # (5) Modality-Aware Dynamic Router (for Fusion MoE)
    modality_aware_router_enabled: true

    # (6) Hard Negative Mining in alignment loss
    hard_negative_enabled: true

    # (7) Identity-Nuisance Orthogonality Loss
    orthogonality_loss_enabled: true
    orthogonality_loss_weight: 0.05

    # (8) Test-Time Multi-Branch Ensemble
    test_time_ensemble_enabled: true

    # (9) Quality-Weighted Modality Dropout
    quality_weighted_dropout_enabled: true

    # (10) QACT (replaces MQE + CondEncoder when true)
    qact_enabled: true

  rgb_anchor_weight: 0.1
  future_weight: 0.01
  verifier: {attention_weight: 0.005}
  SeparateFCs: {in_channels: 512, out_channels: 256, parts_num: 16}
  SeparateBNNecks: {class_num: 250, in_channels: 256, parts_num: 16}
  pc_model_cfg: {channel: 16, npoints: [256, 128, 64], nsample: 8, sampling: knn, scale_aware: true, normalize_dp: true}

optimizer_cfg: {lr: 0.0003, momentum: 0.9, solver: Adam, weight_decay: 0.0005}
scheduler_cfg: {gamma: 0.1, milestones: [20000, 30000], scheduler: MultiStepLR}
trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  with_test: true
  log_iter: 100
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 0
  save_iter: 5000
  save_name: GaitMoEOracleV2Max_SUSTech1K_Vis
  sync_BN: true
  total_iter: 50000
  sampler:
    batch_shuffle: true
    batch_size: [8, 4]
    frames_num_fixed: 10
    sample_type: fixed_unordered
    type: TripletSampler
    points_in_use: {pointcloud_index: 0, points_num: 1024}
  transform:
  - {type: PointCloudsTransform, xyz_only: true, scale_aware: true, scale_prob: 1, flip_prob: 0.15, shift_prob: 0.1, jit_prob: 0.1}
  - {type: BaseRgbNormalizeTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}
  - {type: TextFeatureTransform}
  - {type: NuisanceMaskTransform}
