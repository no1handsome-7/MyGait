data_cfg:
  dataset_name: LongRange
  dataset_root: /data3/user25/dataset-make/gait/OpenGait/data/LRGait
  dataset_partition: /data3/user25/dataset-make/gait/OpenGait/datasets/LongRange/LongRange.json
  num_workers: 4
  data_in_use:
  - true   # point cloud           -> ipts[0] (pc_index=0)
  - false
  - true   # RGB                   -> ipts[1] (rgb_index=1)
  - false
  - true   # qwen25vl_clothing_feat.pkl     -> ipts[2]
  - true   # qwen25vl_carrying_feat.pkl     -> ipts[3]
  - true   # qwen25vl_background_feat.pkl   -> ipts[4]
  - true   # qwen25vl_occlusion_feat.pkl    -> ipts[5]
  - true   # qwen25vl_clothing_mask.pkl     -> ipts[6]
  - true   # qwen25vl_carrying_mask.pkl     -> ipts[7]
  - false  # caption
  - true   # qwen25vl_background_mask.pkl   -> ipts[8]
  - true   # qwen25vl_occlusion_mask.pkl    -> ipts[9]
  remove_no_gallery: false
  test_dataset_name: LongRange
  cache: false

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 30000
  save_name: GaitMoEOracle_RGBPC_LRGait
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    points_in_use:
      pointcloud_index: 0
      points_num: 256
    batch_size: 1
    frames_num_fixed: 10
    frames_skip_num: 0
    sample_type: all_ordered
    frames_all_limit: 720
  metric: euc
  transform:
  - type: PointCloudsTransform
    xyz_only: true
    scale_aware: true
    # scale_prob: 0.5
    # flip_prob: 0.1
    # shift_prob: 0.05
    # jit_prob: 0.03
    points_num: 256
  - type: BaseRgbNormalizeTransform
  - type: TextFeatureTransform
  - type: TextFeatureTransform
  - type: TextFeatureTransform
  - type: TextFeatureTransform
  - type: NuisanceMaskTransform
  - type: NuisanceMaskTransform
  - type: NuisanceMaskTransform
  - type: NuisanceMaskTransform

loss_cfg:
- loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet
- loss_term_weight: 1.0
  scale: 16
  type: CrossEntropyLoss
  log_prefix: softmax
  log_accuracy: true
- loss_term_weight: 1.0
  type: ScalarLoss
  log_prefix: gaitoracle_aux

model_cfg:
  model: GaitMoEOracle
  channels: 256
  parts_num: 16
  rgb_index: 1
  pc_index: 0
  text_dim: 3584
  pc_in_dim: 3
  pc_encoder_type: simple             # simple | lidargaitpp
  proj_dim: 256
  use_scalar_aux_loss: true

  # --- RGB backbone ---
  rgb_backbone:
    type: tiny

  # --- Text adapter ---
  text_adapter:
    input_dim: 3584
    code_dim: 256
    hidden_dim: 1024
    dropout: 0.1

  # --- Positive text gate ---
  positive_text:
    text_dim: 3584
    text_code_dim: 256
    text_hidden_dim: 1024
    prompt_feat_path: tools/gaitoracle/gait_positive_prompt_feat.npy
    num_prompts: 4
    trainable: false
    dropout: 0.1

  # --- Cycle-aware temporal encoder ---
  cycle_temporal:
    heads: 4
    layers: 1
    dropout: 0.1
    future_pred: true

  # --- Nuisance detach ---
  nuisance_indices:
    clothing: 2
    carrying: 3
    background: 4
    occlusion: 5
  nuisance_mask_indices:
    clothing: 6
    carrying: 7
    background: 8
    occlusion: 9
  nuisance_detach:
    enabled: true
    text_dim: 3584
    text_code_dim: 256
    text_hidden_dim: 1024
    sub_dim: 256
    grl_lambda: 0.08
    temperature: 0.07
    warmup_iters: 3000
    probe_iters: 5000
    adv_ramp_iters: 5000
    reliability_start_iter: 8000
    reliability_ramp_iters: 5000
    probe_loss_weight: 0.03
    adv_loss_weight: 0.03
    mask_loss_weight: 0.015
    max_suppression: 0.35
    detach_reliability_gate: true
    dropout: 0.1
    factors:
    - clothing
    - carrying
    - background
    - occlusion
    factor_weights:
      clothing: 1.0
      carrying: 1.0
      background: 0.6
      occlusion: 1.0

  # --- Ablation switches & MoE hyper-parameters ---
  ablation:
    appearance_moe_enabled: true
    appearance_num_experts: 8
    appearance_topk: 2

    structure_moe_enabled: true
    structure_num_experts: 8
    structure_topk: 2

    fusion_moe_enabled: true
    fusion_fallback: cross_attention
    fusion_num_experts: 8
    fusion_topk: 2
    fusion_condition_aware: true

    temporal_type: cycle_aware
    text_guidance_enabled: true
    nuisance_detach_enabled: true

    expert_rank: 16
    expert_dropout: 0.0
    cond_dim: 32
    cond_hidden_dim: 64

    balance_loss_weight: 0.01
    diversity_loss_weight: 0.01
    diversity_threshold: 0.5
    condition_cls_weight: 0.05

  rgb_anchor_weight: 0.1
  future_weight: 0.01
  verifier:
    attention_weight: 0.005

  SeparateFCs:
    in_channels: 256
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 50
    in_channels: 256
    parts_num: 16

  # --- LidarGait++ config (used when pc_encoder_type=lidargaitpp) ---
  pc_model_cfg:
    channel: 16
    npoints: [256, 128, 64]
    nsample: 8
    sampling: knn
    scale_aware: true
    normalize_dp: true

optimizer_cfg:
  lr: 0.05
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones:
  - 15000
  scheduler: MultiStepLR

trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  fix_BN: false
  with_test: true
  log_iter: 100
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 0
  save_iter: 5000
  save_name: GaitMoEOracle_RGBPC_LRGait
  sync_BN: true
  total_iter: 30000
  sampler:
    batch_shuffle: true
    batch_size:
    - 8
    - 4
    frames_num_fixed: 10
    sample_type: fixed_unordered
    type: TripletSampler
    points_in_use:
      pointcloud_index: 0
      points_num: 256
  transform:
  - type: PointCloudsTransform
    xyz_only: true
    scale_aware: true
    scale_prob: 0.5
    flip_prob: 0.1
    shift_prob: 0.05
    jit_prob: 0.03
  - type: BaseRgbNormalizeTransform
  - type: TextFeatureTransform
  - type: TextFeatureTransform
  - type: TextFeatureTransform
  - type: TextFeatureTransform
  - type: NuisanceMaskTransform
  - type: NuisanceMaskTransform
  - type: NuisanceMaskTransform
  - type: NuisanceMaskTransform
