# Template for CCPG GPF experiments.
# Replace dataset_root, dataset_partition and class_num with your local values if needed.

data_cfg:
  dataset_name: CCPG
  dataset_root: /data3/user25/code/OpenGait/data/CCPG-GPF-pkl
  dataset_partition: /data3/user25/code/OpenGait/datasets/CCPG/CCPG.json
  num_workers: 8
  remove_no_gallery: False
  cache: False
  test_dataset_name: CCPG
  data_in_use: [True, False, True, False]

trainer_cfg:
  find_unused_parameters: False
  enable_float16: True
  with_test: True
  fix_BN: False
  log_iter: 100
  restore_ckpt_strict: True
  optimizer_reset: False
  scheduler_reset: False
  restore_hint: 0
  save_iter: 5000
  save_name: 09_gpf_structured_phasefilm
  sync_BN: True
  total_iter: 30000
  sampler:
    type: TripletSampler
    batch_size: [8, 4]
    sample_type: fixed_unordered
    frames_num_fixed: 30
    frames_num_min: 20
    frames_num_max: 40
    frames_skip_num: 0
    batch_shuffle: True
  transform:
    - type: BaseGPFTransform
    - type: BasePhaseTransform

evaluator_cfg:
  restore_hint: 30000
  eval_func: evaluate_CCPG
  save_name: 09_gpf_structured_phasefilm
  restore_ckpt_strict: true
  enable_float16: true
  sampler:
    batch_shuffle: false
    batch_size: 2 # GPUs number
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720
    frames_skip_num: 0
    type: InferenceSampler
  transform:
    - type: BaseGPFTransform
    - type: BasePhaseTransform

loss_cfg:
  - type: TripletLoss
    loss_term_weight: 1.0
    margin: 0.2
    log_prefix: triplet
  - type: CrossEntropyLoss
    loss_term_weight: 1.0
    scale: 16
    log_prefix: softmax
    log_accuracy: true

optimizer_cfg:
  # solver: Adam
  # lr: 0.0003
  # weight_decay: 0.0005
  # momentum: 0.9
  lr: 0.05
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  scheduler: MultiStepLR
  milestones: [15000, 25000]
  gamma: 0.1

model_cfg:
  #visualize
  visualize: True
  visualize_max_frames: 8
  visualize_inputs: True
  visualize_gates: True
  visualize_features: True
  visualize_limb_focus: True

  model: GPFGait
  class_num: 100
  input_index: 0
  source_channels: 12
  enable_channel_norm: True
  geo_indices: [0, 1, 2, 3, 4]
  motion_indices: [5, 8, 9]
  reliability_index: 10
  phase_indices: [6, 7]
  stem_out_channels: 32
  grouped_branch_channels: 24
  residual_branch_channels: 12
  backbone_channels: [64, 128, 256, 512]
  backbone_strides: [1, 2, 1, 1]
  blocks_per_stage: [1, 1, 1, 1]
  bin_num: [32]
  emb_channels: 256
  inference_use_emb2: False
  SeparateFCs:
    parts_num: 32
    in_channels: 512
    out_channels: 256
  SeparateBNNecks:
    parts_num: 32
    in_channels: 256
    class_num: 100

  variant: gpf_structured
  residual_indices: []
  use_reliability_gate: True
  reliability_gate_strength: 0.75 # 0.75
  primitive_dropout: 0.0
  use_phase_film: True
  phase_input_index: 1
  phase_hidden_channels: 32
  phase_film_strength: 0.3
  temporal_pool: max
