# Template for CCPG GPF experiments.
# Replace dataset_root, dataset_partition and class_num with your local values if needed.

data_cfg:
  dataset_name: CCPG
  dataset_root: /data3/user25/code/OpenGait/data/CCPG-GPF-pkl
  dataset_partition: /data3/user25/code/OpenGait/datasets/CCPG/CCPG.json
  num_workers: 8
  remove_no_gallery: False
  cache: False
  test_dataset_name: CCPG
  data_in_use: [True, False, False, False]

trainer_cfg:
  find_unused_parameters: False
  enable_float16: True
  with_test: True
  fix_BN: False
  log_iter: 100
  restore_ckpt_strict: False
  optimizer_reset: False
  scheduler_reset: False
  restore_hint: 0
  save_iter: 5000
  save_name: 10_gpf_structured_viewprompt_full_10ch
  sync_BN: True
  total_iter: 40000
  sampler:
    type: TripletSampler
    batch_size: [8, 4]
    sample_type: fixed_unordered
    frames_num_fixed: 30
    frames_num_min: 20
    frames_num_max: 40
    frames_skip_num: 0
    batch_shuffle: True
  transform:
    - type: BaseGPFTransform
    # - type: Compose
    #   trf_cfg:
    #     - type: BaseGPFTransform
    #     - type: RandomHorizontalFlip
    #       prob: 0.5
    #       flip_negate_indices: [2, 8]
    #     - type: RandomErasing
    #       prob: 0.3
    #       area_ratio_range: [0.02, 0.12]
    #       aspect_ratio_range: [0.3, 3.3]

evaluator_cfg:
  restore_hint: 40000
  eval_func: evaluate_CCPG
  save_name: gpf_structured_viewprompt_full_10ch
  restore_ckpt_strict: false
  enable_float16: true
  sampler:
    batch_shuffle: false
    batch_size: 1 # GPUs number
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720
    frames_skip_num: 0
    type: InferenceSampler
  transform:
    - type: BaseGPFTransform

loss_cfg:
  - type: TripletLoss
    loss_term_weight: 1.0
    margin: 0.2
    log_prefix: triplet
  - type: CrossEntropyLoss
    loss_term_weight: 1.0
    scale: 16
    log_prefix: softmax
    log_accuracy: true
  - type: CrossEntropyLoss
    loss_term_weight: 0.03
    scale: 16
    log_prefix: view_softmax
    log_accuracy: true
  - type: ViewPromptRegularizationLoss
    loss_term_weight: 1.0
    balance_weight: 0.002
    orthogonality_weight: 0.005
    log_prefix: view_prompt_reg

optimizer_cfg:
  solver: Adam
  lr: 0.0003
  weight_decay: 0.0005
  momentum: 0.9
  # lr: 0.05
  # momentum: 0.9
  # solver: SGD
  # weight_decay: 0.0005

scheduler_cfg:
  scheduler: MultiStepLR
  milestones: [15000, 25000, 35000]
  gamma: 0.1

model_cfg:
# visualize
  visualize: False
  visualize_max_frames: 8
  visualize_inputs: True
  visualize_gates: True
  visualize_features: True
  visualize_limb_focus: True

  model: GPFGait
  class_num: 100
  input_index: 0
  source_channels: 12
  enable_channel_norm: True
  # Original 000-gpf.pkl remains 12-channel, but learnable branches consume
  # only these 10 non-phase channels.
  channel_indices: [0, 1, 2, 3, 4, 5, 8, 9, 10, 11]
  geo_indices: [0, 1, 2, 3, 4]
  motion_indices: [5, 8, 9]
  reliability_index: 10
  phase_indices: []
  stem_out_channels: 32
  grouped_branch_channels: 24
  residual_branch_channels: 12
  backbone_channels: [64, 128, 256, 512]
  backbone_strides: [1, 2, 1, 1]
  blocks_per_stage: [1, 1, 1, 1]
  bin_num: [32]
  emb_channels: 256
  inference_use_emb2: False
  SeparateFCs:
    parts_num: 32
    in_channels: 512
    out_channels: 256
  SeparateBNNecks:
    parts_num: 32
    in_channels: 256
    class_num: 100

  variant: gpf_structured
  residual_indices: [11]
  use_reliability_gate: True
  reliability_gate_strength: 0.75
  primitive_dropout: 0.05
  use_phase_film: False
  phase_input_index: null
  temporal_pool: max

  # Full lightweight supervised view prompt.
  # Fill view_prompt_num_views/view_values with count_ccpg_views.py.
  use_view_prompt: True
  view_prompt_num_prompts: 8
  view_prompt_dim: 64
  view_prompt_hidden_channels: 128
  view_prompt_strength: 0.10
  view_prompt_temperature: 0.07
  view_prompt_detach_query: True
  view_prompt_dropout: 0.0
  view_prompt_eps: 1.0e-6

  # Copy this snippet into model_cfg.
  view_prompt_num_views: 37
  view_values:
    - "01_0"
    - "01_1"
    - "01_2"
    - "01_3"
    - "01_4"
    - "01_5"
    - "01_6"
    - "01_7"
    - "01_8"
    - "01_9"
    - "01_10"
    - "01_11"
    - "01_12"
    - "01_13"
    - "01_14"
    - "01_15"
    - "02_0"
    - "02_1"
    - "02_2"
    - "02_3"
    - "03_0"
    - "03_1"
    - "04_0"
    - "04_1"
    - "05_0"
    - "06_0"
    - "07_0"
    - "07_1"
    - "07_2"
    - "07_3"
    - "08_0"
    - "08_1"
    - "09_0"
    - "09_1"
    - "09_2"
    - "10_0"
    - "10_1"






