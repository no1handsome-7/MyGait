# HGCNGPFPP on CCPG GPF-12.
# Baseline input: geometry + motion/optical-flow + reliability + residual.
# No external phase.pkl, no external parts.pkl; internal GPF phase channels 6/7 are not selected.
# Copy to: OpenGait/configs/hgcn_gpfpp/09_hgcn_gpf12_geo_motion_flow_res_ccpg.yaml

data_cfg:
  dataset_name: CCPG
  dataset_root: /data3/user25/code/OpenGait/data/CCPG-GPF-pkl
  dataset_partition: /data3/user25/code/OpenGait/datasets/CCPG/CCPG.json
  num_workers: 8
  remove_no_gallery: false
  cache: false
  test_dataset_name: CCPG
  # GPF-12 usually: 000-gpf.pkl, 001-sils.pkl, 002-phase.pkl, 003-parts.pkl
  # Here only 000-gpf.pkl is used.
  data_in_use: [true, false, false, false]

evaluator_cfg:
  enable_float16: true
  restore_hint: 40000
  save_name: 09_hgcn_gpf12_geo_motion_flow_res_ccpg
  eval_func: evaluate_CCPG
  restore_ckpt_strict: true
  sampler:
    batch_shuffle: false
    type: InferenceSampler
    batch_size: 2
    sample_type: all_ordered
    frames_all_limit: 720
    frames_skip_num: 0
  metric: euc
  transform:
    - type: BaseGPFTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet

  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

  - loss_term_weight: 0.20
    temperature: 0.07
    cross_condition_weight: 2.0
    cross_view_weight: 1.3
    type: CrossConditionSupConLoss
    log_prefix: cross_condition_supcon

  - loss_term_weight: 0.20
    ce_weight: 0.5
    condition_pull_weight: 0.2
    global_pull_weight: 0.1
    condition_global_weight: 0.1
    type: PrototypeClusterLoss
    log_prefix: prototype_cluster

  - loss_term_weight: 1.0
    condition_weight: 0.20
    adv_condition_weight: 0.20
    view_weight: 0.10
    adv_view_weight: 0.10
    nui_id_adv_weight: 0.05
    orth_weight: 0.05
    act_orth_weight: 0.02
    type: FactorDisentangleLoss
    log_prefix: factor_disentangle

  - loss_term_weight: 0.05
    type: ViewObservableLoss
    log_prefix: view_observable


model_cfg:
  model: HGCNGPFPP
  source_channels: 12
  class_num: 100
  condition_class_num: 32
  view_class_num: 12
  input_index: 0
  phase_input_index: null
  parts_input_index: null
  num_parts: 8

  # GPF-12 channel definition:
  # 0 mask, 1 edge, 2 normal-x, 3 normal-y, 4 SDF,
  # 5 motion amplitude, 6 phase-sin, 7 phase-cos,
  # 8 flow-dx, 9 flow-dy, 10 reliability, 11 residual.
  #
  # Baseline keeps: geometry + motion/flow + reliability + residual.
  # It deliberately excludes phase channels 6/7 and external 002-phase/003-parts.
  geo_indices: [0, 1, 2, 3, 4]
  motion_indices: [5, 8, 9, 10]
  # HGCNGPFPP PrimitiveSpecificStem currently expects a non-empty frequency branch.
  # Use reliability as an evidence proxy instead of phase, so no phase channel is used.
  frequency_indices: [10]
  affinity_indices: [11]
  reliability_index: 10
  periodic_index: null
  texture_inverse_index: null

  enable_channel_norm: true
  stem_out_channels: 48
  geo_branch_channels: 16
  motion_branch_channels: 16
  frequency_branch_channels: 4
  affinity_branch_channels: 8
  primitive_gate_strength: 0.75
  primitive_dropout: 0.05

  use_view_film: true
  view_token_dim: 128
  grl_lambda: 1.0

  backbone_channels: [64, 128, 256, 512]
  backbone_strides: [1, 2, 1, 1]
  blocks_per_stage: [1, 1, 1, 1]

  temporal_pool: max
  temporal_topk_ratio: 0.5

  token_dim: 256
  num_action_tokens: 4
  # Strict input baseline: do not use external part map or part gate on HPP.
  use_part_action_gate: false
  part_action_gate_strength: 0.0

  bin_num: [32]
  emb_channels: 256
  factor_dim: 256
  prototype_tau: 0.07
  inference_use_emb2: false
  inference_concat_part: false

  SeparateFCs:
    parts_num: 32
    in_channels: 512
    out_channels: 256
    norm: false
  SeparateBNNecks:
    parts_num: 32
    in_channels: 256
    class_num: 100
    norm: true

  visualize: false

optimizer_cfg:
  # solver: SGD
  # lr: 0.05
  # momentum: 0.9
  # weight_decay: 0.0005
  solver: Adam
  lr: 0.0005
  weight_decay: 0.0005
  momentum: 0.9

scheduler_cfg:
  scheduler: MultiStepLR
  milestones: [15000, 25000, 35000]
  gamma: 0.1

trainer_cfg:
  find_unused_parameters: true
  enable_float16: true
  with_test: true
  fix_BN: false
  sync_BN: true
  log_iter: 100
  restore_ckpt_strict: false
  restore_hint: 0
  optimizer_reset: false
  scheduler_reset: false
  save_iter: 5000
  save_name: 09_hgcn_gpf12_geo_motion_flow_res_ccpg
  total_iter: 40000
  sampler:
    type: TripletSampler
    batch_size: [8, 4]
    sample_type: fixed_unordered
    frames_num_fixed: 30
    frames_num_min: 20
    frames_num_max: 40
    frames_skip_num: 0
    batch_shuffle: true
  transform:
    - type: BaseGPFTransform
